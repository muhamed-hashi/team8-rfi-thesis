<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team 8 · Slides</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d1c; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: none; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  canvas.active { display: block; }
  #msg { color: #d6d8d6; font-size: 16px; text-align: center; padding: 20px; }
  #msg a { color: #f08a4b; }
  #bar { position: fixed; left: 0; top: 0; height: 4px; width: 0; background: #d9661f; transition: width .25s; z-index: 5; }
  #controls { position: fixed; bottom: 14px; right: 14px; display: flex; gap: 8px; z-index: 5; opacity: .4; transition: opacity .2s; }
  #controls:hover { opacity: 1; }
  #controls button, #controls a { font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
    background: #fff; color: #1d1f1e; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; text-decoration: none; }
  #help { position: fixed; bottom: 18px; left: 18px; color: #c9cbc9; font-size: 13px; z-index: 5; opacity: .6; }
  @media (max-width: 700px) { #help { display: none; } }
  body.idle #controls, body.idle #help { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="viewport"><div id="msg">Loading slides…</div></div>
<div id="help">← → to move · F for full screen</div>
<div id="controls">
  <a href="index.html">Back to site</a>
  <button id="prev" aria-label="Previous slide">‹</button>
  <button id="count">–</button>
  <button id="next" aria-label="Next slide">›</button>
  <button id="fs">Full screen</button>
  <a href="slides.pdf" download>Download PDF</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var PDF_URL = 'slides.pdf';
  var vp = document.getElementById('viewport');
  var msg = document.getElementById('msg');
  var bar = document.getElementById('bar');
  var count = document.getElementById('count');
  var pages = [];      // pdf.js page objects
  var canvases = [];
  var i = 0;

  function fail() {
    msg.innerHTML = 'The slides could not be loaded. <a href="slides.pdf">Open the PDF directly</a>.';
  }
  if (!window.pdfjsLib) { fail(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function render(n) {
    var page = pages[n], c = canvases[n];
    var base = page.getViewport({ scale: 1 });
    var fit = Math.min(window.innerWidth / base.width, window.innerHeight / base.height);
    var dpr = window.devicePixelRatio || 1;
    var v = page.getViewport({ scale: fit * dpr });
    c.width = Math.floor(v.width); c.height = Math.floor(v.height);
    c.style.width = Math.floor(v.width / dpr) + 'px';
    c.style.height = Math.floor(v.height / dpr) + 'px';
    return page.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
  }

  function renderAll() {
    var p = Promise.resolve();
    // current slide first, then the rest
    var order = [i];
    for (var k = 0; k < pages.length; k++) if (k !== i) order.push(k);
    order.forEach(function (n) { p = p.then(function () { return render(n); }); });
    return p;
  }

  function show(n) {
    if (!canvases.length) return;
    i = Math.max(0, Math.min(canvases.length - 1, n));
    for (var k = 0; k < canvases.length; k++) canvases[k].classList.toggle('active', k === i);
    bar.style.width = ((i + 1) / canvases.length * 100) + '%';
    count.textContent = (i + 1) + ' / ' + canvases.length;
    history.replaceState(null, '', '#' + (i + 1));
  }

  function toggleFs() {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  }

  pdfjsLib.getDocument(PDF_URL).promise.then(function (pdf) {
    var jobs = [];
    for (var n = 1; n <= pdf.numPages; n++) jobs.push(pdf.getPage(n));
    return Promise.all(jobs);
  }).then(function (ps) {
    pages = ps;
    msg.remove();
    pages.forEach(function () {
      var c = document.createElement('canvas');
      vp.appendChild(c); canvases.push(c);
    });
    var start = parseInt(location.hash.replace('#', ''), 10);
    show(isNaN(start) ? 0 : start - 1);
    return renderAll();
  }).catch(fail);

  var t = null;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () { if (pages.length) renderAll(); }, 150);
  });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') { show(0); }
    else if (k === 'End') { show(canvases.length - 1); }
    else if (k === 'f' || k === 'F') { toggleFs(); }
  });

  vp.addEventListener('click', function (e) {
    if (e.clientX > window.innerWidth / 3) show(i + 1); else show(i - 1);
  });

  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });

  document.getElementById('prev').onclick = function () { show(i - 1); };
  document.getElementById('next').onclick = function () { show(i + 1); };
  document.getElementById('count').onclick = function () { show(0); };
  document.getElementById('fs').onclick = toggleFs;

  // hide controls when the mouse is still (cleaner for presenting)
  var idleT = null;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 2500); }
  document.addEventListener('mousemove', wake);
  wake();
})();
</script>
</body>
</html>
